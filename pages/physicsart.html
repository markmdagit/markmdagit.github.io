<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Art - Marcos Alvarez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        .physics-section {
            text-align: center;
            margin: 2rem 0;
        }
        .canvas-container {
            width: 100%;
            max-width: 1200px; /* Keep it responsive */
            margin: 1rem auto;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px var(--shadow-color);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #f8f9fa; /* Light mode canvas background */
        }
        body.dark-mode canvas {
            background-color: #1a1a1a; /* Dark mode canvas background */
        }
        .controls {
            margin: 1rem 0;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0 0.5rem;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode"><i class="fas fa-moon"></i></button>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="api-examples.html"><i class="fas fa-code"></i> API Examples</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="physics-section">
                <h2>Physics Art</h2>
                <p>Click "Spawn Instance" to launch two dots that will collide. After collision, they trace their trajectory. Build up your art piece by spawning multiple instances!</p>
                <div class="controls">
                    <button id="spawn-btn" class="btn-primary"><i class="fas fa-plus"></i> Spawn Instance</button>
                    <button id="clear-btn" class="btn-primary" style="background-color: #d9534f;"><i class="fas fa-trash"></i> Clear Canvas</button>
                </div>
                <div class="canvas-container">
                    <canvas id="artCanvas" width="1920" height="1080"></canvas>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Marcos Alvarez. Built with Jules by Google.</p>
        </footer>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/physicsart.js"></script>
</body>
</html>
